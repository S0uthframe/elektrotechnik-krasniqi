  <head>

    <!-- Die Schrift liegt auf dem eigenen Server; preload holt sie parallel
         zum Stylesheet statt danach. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Das Hero-Bild bestimmt den LCP. In einer Single-Page-Anwendung steht es
         erst im DOM, wenn das JavaScript geladen, ausgewertet und ausgefuehrt
         ist — der Browser kann es vorher nicht finden. Diese Zeilen machen es
         im urspruenglichen Dokument sichtbar.

         Auf dem Desktop ist zu Beginn das DUNKLE Bild sichtbar; es liegt ueber
         dem hellen und wird erst beim Scrollen weggeschnitten. Wer Animationen
         abgeschaltet hat, sieht nur das helle — daher die zweite Fassung.
         Diese beiden Dateien liegen auf dem eigenen Server; ihre Vorstufe
         steht weiter unten als data-URI und braucht keinen eigenen Abruf.

         Das mobile Bild haengt noch am Bild-CDN, weil seine Originaldatei
         (hell-mobile.png) bislang fehlt. Dort laedt die 48-Pixel-Vorstufe
         deshalb weiterhin ueber das Netz.

         Die Adressen entsprechen exakt denen, die HeroScroll.jsx anfordert;
         weicht hier etwas ab, laedt die Datei zweimal. -->
    <!-- Fuer das mobile Hero-Bild, das noch vom CDN kommt. -->
    <link rel="preconnect" href="https://media.base44.com" />

    <link rel="preload" as="image" fetchpriority="high"
          media="(min-width: 1024px) and (prefers-reduced-motion: no-preference)"
          href="/media/hero-desktop-dunkel-1672w.webp" />
    <link rel="preload" as="image" fetchpriority="high"
          media="(min-width: 1024px) and (prefers-reduced-motion: reduce)"
          href="/media/hero-desktop-hell-1672w.webp" />
    <link rel="preload" as="image" fetchpriority="high"
          media="(max-width: 1023px)"
          href="https://media.base44.com/images/public/6ab1017905a6126f39abd0a8/02b490829_hell-mobile.png/v1/fit/w_48,h_48,q_40,usm_0.66_1.00_0.01,enc_webp,quality_auto/02b490829_hell-mobile.webp" />
    <link rel="preload" as="image" fetchpriority="high"
          media="(max-width: 1023px)"
          href="https://media.base44.com/images/public/6ab1017905a6126f39abd0a8/02b490829_hell-mobile.png/v1/fit/w_900,h_900,q_58,usm_0.66_1.00_0.01,enc_webp,quality_auto/02b490829_hell-mobile.webp" />

    <!-- Erster Frame ohne JavaScript.

         Das Sofortbild weiter oben wird von React gezeichnet und steht damit
         erst, wenn 120 KB JavaScript geladen, ausgewertet und ausgefuehrt sind.
         Dieser Block hier liegt im HTML und faerbt die Hero-Flaeche, sobald das
         Dokument da ist — also mehrere hundert Millisekunden frueher.

         React ersetzt den Inhalt von #root beim ersten Rendern. Der Platzhalter
         verschwindet damit von selbst, und an seiner Stelle steht das gleich
         aufgebaute Sofortbild der Komponente: gleicher Ausschnitt, gleiche
         Unschaerfe, kein sichtbarer Wechsel. -->
    <style>
      #hero-sofort {
        position: absolute;
        inset: 5rem 0 0 0;
        background-color: #081F30;
        background-repeat: no-repeat;
        background-size: cover;
        background-position: top center;
        filter: blur(16px);
        transform: scale(1.08);
      }
      #hero-platzhalter {
        position: relative;
        height: 100vh;
        background-color: #081F30;
        overflow: hidden;
      }
      @media (min-width: 1024px) and (prefers-reduced-motion: no-preference) {
        #hero-sofort { background-image: url("data:image/webp;base64,UklGRoIAAABXRUJQVlA4IHYAAADQAwCdASowABsAPuVapk2pJSOiNVgMASAciWUAt7gc0SeFXRSIfmQA/vBvXMq9NH8THbHLNTKKLJW/3zTBNLvhuw/k0Nn511ovTo53AUq9NxkbiRW0/TKqc+eKDYiLKLcXqumwTsfzFRmzoYjpXkbqDC9aQAAA"); }
      }
      @media (min-width: 1024px) and (prefers-reduced-motion: reduce) {
        #hero-sofort { background-image: url("data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAADQBQCdASowABsAPt1gpU2opiOiNVgMARAbiWgAv2fmBc9nOpjo+YAbO5mme0Uuu0R2vSEdQWMAAP7163zqt/i88XdI7kKMl1tTdpdcMWDN5QEV/5Foqzw9bThnOcFivxFMuLajUSUEsiddBWtd7w6WXpdWLOrEUbY+7rBkDWPkKCW8wBZ6ZyelUt7sYa5ny4nXMNrqS05p4rKw/I3gtBmCB6ObkPAid42dXZsYyzl2H9tEJpTML+eImbJrLimryJ/dXsJ35aJ4iAAA"); }
      }
      @media (max-width: 1023px) {
        #hero-sofort {
          inset: 5rem 0 auto 0;
          height: clamp(220px, 40svh, 300px);
          background-position: center;
          background-image: url("https://media.base44.com/images/public/6ab1017905a6126f39abd0a8/02b490829_hell-mobile.png/v1/fit/w_48,h_48,q_40,usm_0.66_1.00_0.01,enc_webp,quality_auto/02b490829_hell-mobile.webp");
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="hero-platzhalter" aria-hidden="true"><div id="hero-sofort"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
