    <!-- Die Bilder liegen auf einem fremden Ursprung. Ohne diesen Hinweis
         beginnt der Browser mit DNS, TLS und Verbindungsaufbau erst, wenn das
         JavaScript das erste <img> erzeugt hat — gemessen rund 300 ms. -->
    <link rel="preconnect" href="https://media.base44.com" />

    <!-- Die Schrift liegt auf dem eigenen Server; preload holt sie parallel
         zum Stylesheet statt danach. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Das Hero-Bild ist das groesste sichtbare Element und bestimmt damit den
         LCP. In einer Single-Page-Anwendung steht es erst im DOM, wenn das
         JavaScript geladen, ausgewertet und ausgefuehrt ist — der Browser kann
         es vorher nicht finden. Diese Zeilen machen es im urspruenglichen
         Dokument sichtbar.

         Auf dem Desktop ist das zu Beginn sichtbare Bild das DUNKLE: Es liegt
         ueber dem hellen und wird erst beim Scrollen weggeschnitten. Vorgeladen
         wird deshalb das dunkle — laedt das helle zuerst, blitzt es kurz auf,
         bevor das dunkle es ueberdeckt.

         Ausnahme: Wer Animationen abgeschaltet hat, sieht die dunkle Fassung
         nie. Fuer diesen Fall wird das helle Bild vorgeladen und das dunkle
         gar nicht erst angefordert.

         Die Adressen entsprechen exakt denen, die HeroScroll.jsx anfordert
         (src/lib/cdn-image.js); weicht hier etwas ab, laedt die Datei zweimal. -->
    <link rel="preload" as="image" fetchpriority="high"
          media="(min-width: 1024px) and (prefers-reduced-motion: no-preference)"
          href="https://media.base44.com/images/public/6ab1017905a6126f39abd0a8/b8afcdfb2_Codex-Bild21Sept202614_48_20.png/v1/fit/w_1600,h_1600,q_85,usm_0.66_1.00_0.01,enc_webp,quality_auto/b8afcdfb2_Codex-Bild21Sept202614_48_20.webp" />
    <link rel="preload" as="image" fetchpriority="high"
          media="(min-width: 1024px) and (prefers-reduced-motion: reduce)"
          href="https://media.base44.com/images/public/6ab1017905a6126f39abd0a8/ca03c90ed_Codex-Bild21Sept202614_43_58.png/v1/fit/w_1600,h_1600,q_85,usm_0.66_1.00_0.01,enc_webp,quality_auto/ca03c90ed_Codex-Bild21Sept202614_43_58.webp" />
    <link rel="preload" as="image" fetchpriority="high" media="(max-width: 1023px)"
