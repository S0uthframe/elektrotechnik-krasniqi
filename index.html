         Danach das eigentliche Bild. Auf dem Desktop ist zu Beginn das DUNKLE
         sichtbar; es liegt ueber dem hellen und wird erst beim Scrollen
         weggeschnitten. Wer Animationen abgeschaltet hat, sieht nur das helle —
         dafuer die zweite Fassung je Breakpoint.

         Eine Vorverbindung (preconnect) steht hier bewusst nicht mehr: Diese
         Preloads oeffnen die Verbindung bereits selbst, der zusaetzliche
         Hinweis blieb im Bericht ungenutzt.

    <!-- Erster Frame ohne JavaScript.

         Das Sofortbild weiter oben wird von React gezeichnet und steht damit
         erst, wenn 120 KB JavaScript geladen, ausgewertet und ausgefuehrt sind.
         Dieser Block hier liegt im HTML und faerbt die Hero-Flaeche, sobald das
         Dokument da ist — also mehrere hundert Millisekunden frueher.

         React ersetzt den Inhalt von #root beim ersten Rendern. Der Platzhalter
         verschwindet damit von selbst, und an seiner Stelle steht das gleich
         aufgebaute Sofortbild der Komponente: gleicher Ausschnitt, gleiche
         Unschaerfe, kein sichtbarer Wechsel. -->
    <style>
      #hero-sofort {
        position: absolute;
        inset: 5rem 0 0 0;
        background-color: #081F30;
        background-repeat: no-repeat;
        background-size: cover;
        background-position: top center;
        filter: blur(16px);
        transform: scale(1.08);
      }
      #hero-platzhalter {
        position: relative;
        height: 100vh;
        background-color: #081F30;
        overflow: hidden;
      }
      @media (min-width: 1024px) and (prefers-reduced-motion: no-preference) {
        #hero-sofort { background-image: url("https://media.base44.com/images/public/6ab1017905a6126f39abd0a8/b8afcdfb2_Codex-Bild21Sept202614_48_20.png/v1/fit/w_48,h_48,q_40,usm_0.66_1.00_0.01,enc_webp,quality_auto/b8afcdfb2_Codex-Bild21Sept202614_48_20.webp"); }
      }
      @media (min-width: 1024px) and (prefers-reduced-motion: reduce) {
